<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Belltide</title>
<style>
  :root { --bg:#f6f4ef; --card:#fff; --text:#222; --sub:#666; --accent:#1a7f5a; --line:#e3dfd6; --hi:#fff3c4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181a; --card:#212427; --text:#eee; --sub:#aaa; --accent:#3fbf8a; --line:#33373b; --hi:#4a4020; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .card { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line);
          border-radius:18px; padding:28px 22px; text-align:center; }
  h1 { font-size:20px; margin:0 0 6px; }
  p.sub { color:var(--sub); font-size:14px; margin:0 0 22px; line-height:1.5; }
  .btn { display:block; width:100%; padding:15px; border-radius:12px; font-size:16px; font-weight:600;
         text-decoration:none; margin-bottom:10px; border:1px solid var(--line); color:var(--text); background:transparent; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .hidden { display:none !important; }
  footer { margin-top:20px; font-size:11px; color:var(--sub); }

  /* 인앱 브라우저 탈출 안내 */
  body.escape { align-items:flex-start; padding-top:96px; }
  .pointer { position:fixed; top:6px; right:14px; text-align:right; pointer-events:none; }
  .pointer .arrow { font-size:46px; line-height:1; color:var(--accent); display:inline-block;
                    animation:bob 1s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
  .steps { text-align:left; margin:0 0 20px; padding:16px; border-radius:14px; background:var(--hi); }
  .steps .step { display:flex; gap:12px; align-items:flex-start; font-size:16px; line-height:1.5; }
  .steps .step + .step { margin-top:12px; }
  .steps .num { flex:none; width:26px; height:26px; border-radius:50%; background:var(--accent); color:#fff;
                font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px; }
  .steps b { font-size:17px; }
</style>
</head>
<body>
<div class="pointer hidden" id="pointer"><span class="arrow">⬆</span></div>

<div class="card">
  <h1 id="title"></h1>
  <p class="sub" id="desc"></p>

  <div class="steps hidden" id="steps">
    <div class="step"><span class="num">1</span><span id="step1"></span></div>
    <div class="step"><span class="num">2</span><span id="step2"></span></div>
  </div>

  <a class="btn primary hidden" id="btnStore" href="#"></a>
  <a class="btn hidden" id="btnWeb" href="#"></a>

  <footer>Belltide</footer>
</div>

<script>
/* ===== 링크 목록 =====
   링크 형식: https://mega-rabbit.com/belltide/go/?app=키   (app 없으면 개발자 페이지)
   play = play.google.com/store/apps/ 뒤에 오는 경로 */
var APPS = {
  dev:        { name: "Belltide",                         play: "dev?id=6621226786729091125" },
  prince:     { name: "Secret Prince: Romance Puzzle",    play: "details?id=com.megarabbit.jadeaffinity" },
  santorini:  { name: "Santorini Romance: Triple Tile",   play: "details?id=com.belltide.santorini" },
  islandcafe: { name: "Island Cafe Romance: 3 Tiles",     play: "details?id=com.megarabbit.bluecafe" }
};
/* ===================== */

/* ===== 화면 문구 (휴대폰 언어: 한국어·일본어, 그 외는 영어) ===== */
var TEXT = {
  ko: {
    loading: "스토어로 이동 중…",
    wait: "잠시만 기다려 주세요. 자동으로 열리지 않으면 아래 버튼을 눌러 주세요.",
    notFound: "링크를 찾을 수 없어요", badLink: "잘못된 링크예요.",
    blocked: "이 앱 안에서는 Google Play가 바로 열리지 않아요.",
    step1: "화면 오른쪽 위 <b>⋯</b> 버튼을 누르세요",
    step2: "<b>‘브라우저에서 열기’</b>를 누르면 Google Play가 열려요",
    store: "Google Play에서 열기", web: "웹 스토어 페이지 열기",
    android: "현재 안드로이드(Google Play)에서만 플레이할 수 있어요."
  },
  ja: {
    loading: "ストアに移動しています…",
    wait: "少々お待ちください。自動で開かない場合は下のボタンを押してください。",
    notFound: "リンクが見つかりません", badLink: "無効なリンクです。",
    blocked: "このアプリ内ではGoogle Playを直接開けません。",
    step1: "画面右上の <b>⋯</b> ボタンを押してください",
    step2: "<b>「ブラウザで開く」</b>を選ぶとGoogle Playが開きます",
    store: "Google Playで開く", web: "ストアのWebページを開く",
    android: "現在はAndroid(Google Play)のみでプレイできます。"
  },
  en: {
    loading: "Opening the store…",
    wait: "Please wait a moment. If nothing happens, tap the button below.",
    notFound: "Link not found", badLink: "This link is invalid.",
    blocked: "Google Play can't open directly inside this app.",
    step1: "Tap the <b>⋯</b> button at the top right",
    step2: "Choose <b>“Open in browser”</b> and Google Play will open",
    store: "Open in Google Play", web: "Open store web page",
    android: "Currently available on Android (Google Play) only."
  }
};
var LANG = (navigator.language || "en").slice(0, 2).toLowerCase();
var T = TEXT[LANG] || TEXT.en;
document.documentElement.lang = TEXT[LANG] ? LANG : "en";
/* ================================================================ */

(function () {
  var q = new URLSearchParams(location.search);
  var app = APPS[q.get("app") || "dev"] || null;
  var path = app ? app.play : (q.get("id") ? "details?id=" + encodeURIComponent(q.get("id")) : "");

  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isKakao = /KAKAOTALK/i.test(ua);
  var isTikTok = /musical_ly|Bytedance|TikTok|trill/i.test(ua);
  var isInApp = isKakao || isTikTok || /Instagram|FBAN|FBAV|FB_IAB|Line\/|NAVER|Snapchat|Threads|; wv\)/i.test(ua);

  var $ = function (id) { return document.getElementById(id); };
  var show = function (id) { $(id).classList.remove("hidden"); };
  var hide = function (id) { $(id).classList.add("hidden"); };

  $("title").textContent = T.loading;
  $("desc").textContent = T.wait;
  $("step1").innerHTML = T.step1;
  $("step2").innerHTML = T.step2;
  $("btnStore").textContent = T.store;
  $("btnWeb").textContent = T.web;

  if (!path) {
    $("title").textContent = T.notFound;
    $("desc").textContent = T.badLink;
    return;
  }
  document.title = app ? app.name : "Belltide";
  if (app) $("title").textContent = app.name;

  // 카카오톡 인앱 브라우저는 외부 브라우저로 바로 탈출
  if (isKakao) {
    location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);
    return;
  }

  var playWeb = "https://play.google.com/store/apps/" + path;
  // 앱 상세는 market:// 로, 개발자 페이지는 market://dev 를 지원하지 않아 https 주소를 Play 스토어 앱에 직접 넘김
  var fallback = ";S.browser_fallback_url=" + encodeURIComponent(playWeb) + ";end";
  var storeIntent = /^dev\?/.test(path)
    ? "intent://play.google.com/store/apps/" + path + "#Intent;scheme=https;package=com.android.vending" + fallback
    : "intent://" + path + "#Intent;scheme=market;package=com.android.vending" + fallback;

  // 외부 브라우저로 나가 달라는 안내 화면
  function escapeGuide() {
    document.body.classList.add("escape");
    $("desc").textContent = T.blocked;
    show("pointer"); show("steps");
    hide("btnStore");
    $("btnWeb").href = playWeb;
    show("btnWeb");
  }

  // 아이폰: 안드로이드 전용 안내
  if (isIOS) {
    $("desc").textContent = T.android;
    $("btnWeb").href = playWeb;
    show("btnWeb");
    return;
  }

  // 틱톡: 앱 호출(intent)을 전부 막으므로 처음부터 안내 화면
  if (isAndroid && isTikTok) {
    escapeGuide();
    return;
  }

  // 그 밖의 안드로이드 인앱 브라우저: Play 스토어 호출을 시도하고, 화면이 그대로면 안내로 전환
  if (isAndroid && isInApp) {
    $("btnStore").href = storeIntent;
    show("btnStore");
    location.href = storeIntent;
    setTimeout(function () { if (!document.hidden) escapeGuide(); }, 1500);
    return;
  }

  // 일반 브라우저(크롬 등) 또는 PC
  $("btnStore").href = isAndroid ? storeIntent : playWeb;
  show("btnStore");
  location.replace(playWeb);
})();
</script>
</body>
</html>
